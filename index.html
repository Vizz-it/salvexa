function getStored(key, def) {
  try {
    const val = localStorage.getItem(key);
    if (!val) return def;
    const parsed = JSON.parse(val);

  } catch (e) {

}

function setStored(key, val) {
  try {

}

function getInitials(name) {
  if (!name || typeof name !== 'string') return 'U';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2 && parts[0] && parts[parts.length - 1]) {
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  return name.substring(0, 2).toUpperCase() || 'U';
}

function safeRender() {
  try {
    render();
  } catch (err) {
    console.error('SalveXa render error, resetting state:', err);
    S.user = null;
    S.role = null;
    S.view = 'home';
    saveState();
    try { render(); } catch (e) {}
  }
}

function doLogin() {
  const f = [1, 2, 3, 4].map(i => ($('#f' + i) ? $('#f' + i).value.trim() : '')), c = S.role === 'customer';

  if (f.some(x => !x)) e = 'Fill in every field to continue.';
  else if (!/^\d{10}$/.test(f[2])) e = 'Phone number must be 10 digits.';
  else if (c && (+f[1] < 1 || +f[1] > 120)) e = 'Enter a valid age.';
  if (e) { if ($('#err')) $('#err').textContent = e; return; }
  
  S.user = {
    name: f[0],
    email: (S.user && S.user.email) ? S.user.email : (f[0].toLowerCase().replace(/\s+/g, '') + '@gmail.com'),
    age: c ? f[1] : undefined,
    lic: c ? undefined : f[1],
    phone: f[2],
    address: f[3],
    picture: (S.user && S.user.picture) ? S.user.picture : null,
    provider: (S.user && S.user.provider) ? S.user.provider : 'manual'
  };
  saveState();
  go(c ? 'shop' : 'seller');
}

let mapInstance = null;
function initLeafletMap() {
  const mapEl = document.getElementById('map');
  if (!mapEl || typeof L === 'undefined') return;

  if (mapInstance) {
    mapInstance.remove();
    mapInstance = null;
  }

  // Centered at Punjab, India
  mapInstance = L.map('map').setView([30.9010, 75.8573], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap contributors'
  }).addTo(mapInstance);

  nearbyShops.forEach(s => {
    const marker = L.marker([s.lat, s.lng]).addTo(mapInstance);
    marker.bindPopup(`
      <div style="font-family:'DM Sans',sans-serif;padding:4px">
        <b style="color:#C1121F;font-size:15px">${esc(s.name)}</b><br>
        <span style="font-size:13px;color:#666">${esc(s.dist)} away · ${esc(s.rating)}</span><br>
        <span style="font-size:12px;color:#333">${esc(s.address)}</span><br>
        <button style="margin-top:8px;background:#C1121F;color:white;border:0;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer" onclick="selectPharmacy(${s.id})">Select Store</button>
      </div>
    `);
  });

  // Ensure tiles load completely inside Canvas container
  setTimeout(() => { if (mapInstance) mapInstance.invalidateSize(); }, 300);
}

function selectPharmacy(id) {

function processAiScan(el) {
  const file = el.files ? el.files[0] : null;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    runAiAnalysisSimulation(reader.result, file.name, false);
  };
  reader.readAsDataURL(file);
}

function runAiDemo(type) {
  const isAuthentic = (type === 'authentic');
  const sampleUrl = isAuthentic 
    ? 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=400&q=80'
    : 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=400&q=80';
  runAiAnalysisSimulation(sampleUrl, isAuthentic ? 'Doctor_Prescription_DrSharma.jpg' : 'AI_Generated_Rx_Edit.png', !isAuthentic);
}

function runAiAnalysisSimulation(dataUrl, filename, forceTampered) {
  const output = document.getElementById('ai_scan_output');
  if (!output) return;

  output.innerHTML = `<div style="text-align:center;padding:20px;background:#faf5ff;border-radius:12px;border:1px solid #e9d5ff">
    <div style="font-size:24px;margin-bottom:8px">🔍 Scanning Image Artifacts & Metadata...</div>
    <div class="ai-meter"><div id="ai_fill" class="ai-meter-fill"></div></div>
    <div id="ai_status" class="muted" style="font-size:14px">Analyzing noise distribution & font consistency...</div>
  </div>`;

  let progress = 0;
  const interval = setInterval(() => {
    progress += 25;
    const fill = document.getElementById('ai_fill');
    const status = document.getElementById('ai_status');
    if (fill) fill.style.width = progress + '%';
    
    if (progress === 50 && status) status.textContent = 'Verifying Doctor Stamp, License Signature & Edge Sharpness...';
    if (progress === 75 && status) status.textContent = 'Extracting Medicine Names & Checking Dosage Safety...';

    if (progress >= 100) {
      clearInterval(interval);
      renderAiScanFinalResult(dataUrl, filename, forceTampered);
    }
  }, 250);
}

function renderAiScanFinalResult(dataUrl, filename, isTampered) {
  const output = document.getElementById('ai_scan_output');

  saveState();
  cart();
}

function place(total, needRx) {
  if (needRx && !S.rxData) { if ($('#err')) $('#err').textContent = 'Upload your prescription to order Rx medicine.'; return; }
  const o = {
    id: 1001 + S.orders.length,
    cust: { ...S.user },
    shop: S.selectedShop,
    items: Object.keys(S.cart).map(id => {
      const m = S.meds.find(x => x.id == id);
      return m ? { mid: m.id, name: m.name, n: S.cart[id], unit: eff(m) } : null;
    }).filter(Boolean),
    rx: S.rx,
    rxData: S.rxData,
    aiVerified: S.aiScanResult?.authentic || false,
    total,
    st: 'Pending',
    date: new Date().toLocaleDateString()
  };
  S.orders.unshift(o);
  S.last = o;
  S.cart = {};
  S.rx = null;
  S.rxData = null;
  S.aiScanResult = null;
  saveState();
  go('done');
}

function saveMed() {
  const v = i => ($('#n' + i) ? $('#n' + i).value.trim() : ''), name = v(1), price = +v(2), disc = +v(5) || 0, stock = +v(6) || 0;
  if (!name || !(price > 0)) { if ($('#err')) $('#err').textContent = 'Enter a valid name and price greater than 0.'; return; }
  if (disc < 0 || disc > 90) { if ($('#err')) $('#err').textContent = 'Discount must be between 0% and 90%.'; return; }
  const isRx = $('#n3') ? $('#n3').checked : false;
  const d = { name, price, disc, stock, cat: v(4), note: v(7), info: v(8) || 'Added by pharmacy seller.', rx: isRx };
  if (S.edit === 'new') S.meds.push({ id: Date.now(), ...d });
  else {
    const existing = S.meds.find(x => x.id === S.edit);
    if (existing) Object.assign(existing, d);
  }
  S.edit = null;
  saveState();
  seller();
}

function bulk() {
  const c = $('#bc') ? $('#bc').value : 'All', p = $('#bp') ? +$('#bp').value : 0;
  if (!(p >= 0 && p <= 90)) return;
  S.meds.forEach(m => { if (c === 'All' || m.cat === c) m.disc = p; });
  saveState();
  seller();
}

function tog(id) {
  const m = S.meds.find(x => x.id === id);
  if (!m) return;
  m.off = !m.off;
  if (m.off) delete S.cart[id];
  saveState();
  sCat();
}

function del(id) {
  S.meds = S.meds.filter(x => x.id !== id);
  delete S.cart[id];
  saveState();
  seller();
}

function sOrd(sts, empty) {
  const l = S.orders.filter(o => sts.includes(o.st));
  if (!$('#sv')) return;
  $('#sv').innerHTML = l.length ? l.map(o => `<div class="card">
    <div class="row" style="border:0;padding:0"><b>#${o.id}</b><span class="tag${o.st === 'Delivered' ? ' ok' : ''}">${o.st}</span></div>
    <div style="font-size:14px;margin-top:6px">${oline(o)}</div>
    <div class="muted" style="font-size:14px;margin-top:4px">${esc(o.cust ? o.cust.name : 'Customer')}, ${esc(o.cust ? (o.cust.age || 25) : 25)} yrs · ${esc(o.cust ? o.cust.phone : '')}<br>${esc(o.cust ? o.cust.address : '')}</div>
    <div style="margin:4px 0 8px">
      <b>Total: ₹${o.total}</b> · ${o.rxData ? '<button class="link" onclick="viewRx(' + o.id + ')">View Prescription</button>' : 'No Rx required'}
      ${o.aiVerified ? ' <span class="tag purple">🤖 AI Verified</span>' : ''}
    </div>
    ${o.st === 'Pending' ? '' : stepper(o.st)}
    <div class="bar">${acts(o)}</div>
  </div>`).join('') : `<p class="muted">${empty}</p>`;
}

function acts(o) {
  const b = (t, st, g) => `<button class="btn sm${g ? ' ghost' : ''}" onclick="act(${o.id},'${st}')">${t}</button>`;
  return {
    Pending: b('Confirm Order', 'Confirmed') + b('Reject', 'Rejected', 1),
    Confirmed: b('Mark Packed', 'Packed'),
    Packed: b('Send Out for Delivery', 'Out for delivery'),
    'Out for delivery': b('Mark Delivered', 'Delivered')
  }[o.st] || '';
}

function act(id, st) {
  const o = S.orders.find(x => x.id === id);
  if (!o) return;
  o.st = st;
  if (st === 'Confirmed') (o.items || []).forEach(i => { const m = S.meds.find(x => x.id === i.mid); if (m) m.stock = Math.max(0, m.stock - i.n); });
  saveState();
  seller();
}

// Initial safe render call on page load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', safeRender);
} else {
  safeRender();
}
</script>
</body>
</html>
